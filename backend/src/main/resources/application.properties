spring.application.name=instadog-backend

# Server
server.port=8080

# Database (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/instadog
spring.datasource.username=instadog
spring.datasource.password=instadog123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false

# Multipart (upload de imagens)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT
instadog.jwt.secret=minha-chave-secreta-do-instadog-que-deve-ser-alterada-em-producao
instadog.jwt.expiration=86400000

# OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Upload de imagens
instadog.upload.dir=uploads/posts
instadog.upload.base-url=http://localhost:8080/uploads/

# Logging
logging.level.com.instadog=INFO
logging.level.org.springframework.security=INFO
