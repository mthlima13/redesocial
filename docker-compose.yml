services:
  postgres:
    image: postgres:15-alpine
    container_name: instadog-db
    environment:
      POSTGRES_DB: instadog
      POSTGRES_USER: instadog
      POSTGRES_PASSWORD: instadog123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instadog -d instadog"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
